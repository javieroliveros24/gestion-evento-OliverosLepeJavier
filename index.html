<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="data:,">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestor de participantes del evento</title>
  <link rel="stylesheet" href="css/estilos.css">
  <!-- defer: se descargan en paralelo y se ejecutan en este orden cuando el DOM ya está construido -->
  <script src="js/logica.js" defer></script>
  <script src="js/cookies.js" defer></script>
  <script src="js/preferencias.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body>
  <header class="cabecera">
    <h1>Gestor de participantes del evento</h1>
    <nav class="acciones-ayuda" aria-label="Ayuda">
      <button id="btn-ayuda" type="button">Abrir ayuda</button>
      <button id="btn-cerrar-ayuda" type="button">Cerrar ayuda</button>
      <p id="msg-ayuda" class="mensaje" role="status" aria-live="polite"></p>
    </nav>
  </header>

  <main class="rejilla">
    <section class="caja" aria-labelledby="titulo-alta">
      <h2 id="titulo-alta">Alta de participante</h2>
      <form id="form-alta" novalidate>
        <div class="campo">
          <label for="nombre">Nombre</label>
          <input id="nombre" name="nombre" type="text" autocomplete="name" maxlength="80">
          <span class="error-campo" data-error-de="nombre"></span>
        </div>

        <div class="campo">
          <label for="edad">Edad (0-120)</label>
          <input id="edad" name="edad" type="text" inputmode="numeric">
          <span class="error-campo" data-error-de="edad"></span>
        </div>

        <div class="campo">
          <label for="tipo">Tipo</label>
          <select id="tipo" name="tipo">
            <option value="estudiante">Estudiante</option>
            <option value="profesional">Profesional</option>
            <option value="invitado">Invitado</option>
          </select>
          <span class="error-campo" data-error-de="tipo"></span>
        </div>

        <div class="campo">
          <label for="modalidad">Modalidad</label>
          <select id="modalidad" name="modalidad">
            <option value="presencial">Presencial</option>
            <option value="online">Online</option>
          </select>
          <span class="error-campo" data-error-de="modalidad"></span>
        </div>

        <div class="campo">
          <label for="experiencia">Experiencia (0-10, admite decimales)</label>
          <input id="experiencia" name="experiencia" type="text" inputmode="decimal">
          <span class="error-campo" data-error-de="experiencia"></span>
        </div>

        <button type="submit" class="principal">Inscribir participante</button>
      </form>
      <div id="resumen-errores" class="resumen-errores oculto" role="alert"></div>
      <p id="msg-alta" class="mensaje" role="status" aria-live="polite"></p>
    </section>

    <section class="caja" aria-labelledby="titulo-estadisticas">
      <h2 id="titulo-estadisticas">Estadísticas</h2>
      <p class="nota">Calculadas sobre todos los participantes, aunque el listado esté filtrado.</p>
      <dl id="panel-estadisticas" class="lista-datos"></dl>
    </section>

    <section class="caja ancha" aria-labelledby="titulo-listado">
      <h2 id="titulo-listado">Participantes</h2>
      <div class="filtros">
        <div class="campo">
          <label for="busqueda-nombre">Buscar por nombre</label>
          <input id="busqueda-nombre" type="search" placeholder="Ej.: ana">
        </div>
        <div class="campo">
          <label for="filtro-modalidad">Modalidad</label>
          <select id="filtro-modalidad">
            <option value="todas">Todas</option>
            <option value="presencial">Presencial</option>
            <option value="online">Online</option>
          </select>
        </div>
      </div>
      <p id="msg-listado" class="aviso oculto" role="status"></p>
      <div id="contenedor-tarjetas" class="tarjetas"></div>
    </section>

    <section class="caja" aria-labelledby="titulo-json">
      <h2 id="titulo-json">Exportar e importar (JSON)</h2>
      <label for="json-area">Colección en formato JSON</label>
      <textarea id="json-area" rows="10" spellcheck="false"></textarea>
      <div class="botones">
        <button id="btn-exportar" type="button">Exportar</button>
        <button id="btn-importar" type="button">Importar</button>
      </div>
      <p id="msg-json" class="mensaje" role="status" aria-live="polite"></p>
    </section>

    <section class="caja" aria-labelledby="titulo-panel">
      <h2 id="titulo-panel">Panel del evento</h2>
      <iframe id="iframe-panel" src="panel.html" title="Panel resumen del evento: total de inscritos, modalidades y última inscripción"></iframe>
    </section>

    <section class="caja" aria-labelledby="titulo-preferencias">
      <h2 id="titulo-preferencias">Preferencias</h2>
      <form id="form-preferencias">
        <div class="campo">
          <label for="select-tema">Tema</label>
          <select id="select-tema">
            <option value="claro">Claro</option>
            <option value="oscuro">Oscuro</option>
          </select>
        </div>
        <div class="campo">
          <label for="select-tamano">Tamaño de letra</label>
          <select id="select-tamano">
            <option value="normal">Normal</option>
            <option value="grande">Grande</option>
          </select>
        </div>
        <div class="botones">
          <button type="submit">Guardar preferencias</button>
          <button id="btn-restablecer" type="button">Restablecer</button>
        </div>
      </form>
      <p id="msg-preferencias" class="mensaje" role="status" aria-live="polite"></p>
    </section>
  </main>
</body>
</html>

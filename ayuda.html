    <!doctype html>
    <html lang="es">
    <head>
    <meta charset="utf-8">
    <title>Ayuda de la Aplicación</title>
    <link rel="stylesheet" href="css/estilos.css">
    <script>
        document.addEventListener("DOMContentLoaded", function() {
        const info = document.getElementById("info-navegador");
        info.textContent = `Idioma: ${navigator.language} | Origen: ${location.origin} | Pantalla: ${screen.width}x${screen.height}`;

        document.getElementById("btn-cerrar").addEventListener("click", function() {
            window.close();
        });
        });
    </script>
    </head>
    <body style="padding: 1.5rem; font-family: sans-serif;">
    <h1>Manual de Usuario</h1>
    <p>Esta aplicación permite gestionar la inscripción a eventos tecnológicos.</p>
    <div id="info-navegador" style="background: #eef; padding: 0.8rem; border-radius: 4px; margin: 1rem 0;"></div>
    <button id="btn-cerrar">Cerrar Ayuda</button>
    </body>
    </html>
